name: google_mlkit_image_labeling
description: "A Flutter plugin to use Google's ML Kit Image Labeling to detect and extract information about entities in an image across a broad group of categories."
version: 0.14.1
homepage: https://github.com/flutter-ml/google_ml_kit_flutter
repository: https://github.com/flutter-ml/google_ml_kit_flutter/tree/master/packages/google_mlkit_image_labeling
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_commons:
    git:
      url: https://github.com/flutter-ml/google_ml_kit_flutter.git
      path: packages/google_mlkit_commons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.google_mlkit_image_labeling
        pluginClass: GoogleMlKitImageLabelingPlugin
      ios:
        pluginClass: GoogleMlKitImageLabelingPlugin
