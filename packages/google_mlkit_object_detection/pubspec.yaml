name: google_mlkit_object_detection
description: "A Flutter plugin to use Google's ML Kit Object Detection and Tracking to detect and track objects in an image or live camera feed."
version: 0.15.0
homepage: https://github.com/flutter-ml/google_ml_kit_flutter
repository: https://github.com/flutter-ml/google_ml_kit_flutter/tree/master/packages/google_mlkit_object_detection
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_commons:
    git:
      url: https://github.com/flutter-ml/google_ml_kit_flutter.git
      path: packages/google_mlkit_commons
      ref: develop

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.google_mlkit_object_detection
        pluginClass: GoogleMlKitObjectDetectionPlugin
      ios:
        pluginClass: GoogleMlKitObjectDetectionPlugin
